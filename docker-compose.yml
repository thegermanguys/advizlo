# Local development Postgres only. Hosted Postgres is Neon.
# The API and web app deploy as two Vercel projects; this file is not used there.
version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: advizlo
      POSTGRES_PASSWORD: advizlo
      POSTGRES_DB: advizlo
    ports:
      - "5432:5432"
    volumes:
      - advizlo_pg_data:/var/lib/postgresql/data

volumes:
  advizlo_pg_data:
